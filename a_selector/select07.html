<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가상 요소 선택자</title>
    <style>
        button:active{
            background-color: pink;
        } /*. 누르고 있을때 */
        button:hover{
            color: blue;
        }.    /*. 마우스를 올렸을때 색 바뀜 */
        a:visited{
            color: blue;
        }
        a:link{
            color: black;
        }
        /* 가상요소  */
        p::after{
            content: "" ;
            display: block;
            width: 100px;
            height: 100px;
            background-color: red;
        }
    </style>
</head>
<body>
    <!--         
        - :link - 방문한 적이 없는 링크
        - :visited - 방문한 적이 있는 링크
        - :hover - 마우스를 롤오버 했을 때
        - :active - 마우스를 클릭했을 때 
    -->
    <butten class="btn">어흥!</butten>
    <a href="https://store.kakao.com/kakaofriends">카카오프랜즈샵</a>
    <a href="https://www.naver.com">네이버</a>
    <p><글자1/p>
</body>
</html>
