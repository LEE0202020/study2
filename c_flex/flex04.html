<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/flex04.css">
    <title>flex04</title>
</head>
<body>
    <div id="wrap">   <!--  #wrap :전체 페이지를 감쌈-->
        <header class="header">   <!-- header: 머리말(상단 영역)을 의미함 -->
            <div class="img-wrap">
                <img src="./images/logo.png" alt="로고">
            </div>
            <nav class="menu-wrapper"> <!-- nav: 링크 이동 태그  --><!-- menu-wrap: 오른쪽에 메뉴 붙임 -->
                <div class="menu-wrap">
                    <a class="menu" href="#">회사정보</a>
                    <a class="menu" href="#">애완동물 용품</a>
                    <a class="menu" href="#">애완동물 간식</a>
                    <a class="menu" href="#">찾아오시는 길</a>
                </div>
            </nav>
        </header>
        <div class="slide"></div>
        <div class="content-wrap">
            <div class="content notice">
                <ol>
                    <li>사이트가 새롭게 리뉴얼 되었습니다.</li>
                    <li>코리아IT아카데미 강남점 오픈합니다.</li>
                    <li>공지사항을 확인해주세요. 긴급입니다</li>
                </ol>
            </div>
            <div class="content banner"></div>
            <div class="content navigate">
                <a href="#">유기동물 후원사이트</a>
            </div>
        </div>
        <footer class="footer">
            <span>ⓒcopyright</span>
        </footer>
    </div>
</body>
</html>
