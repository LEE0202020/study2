<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>링크 태그(a)</title>
</head>
<body>
    <!-- <a href="주소">네이버로 이동</a> -->
    <!-- 외부 링크 -->
    <!-- target="_self": 현재 탭으로 이동 -->
    <a href="./www.name.com" target="_self">네이버로 이동</a>
    <!-- target="_blank": 새탭으로 이동 -->
    <a href="https://www.name.com" target="_blank">네이버로 이동</a>
    <a href="https://www.name.com" target="">네이버로 이동</a>
    <!-- 내부 링크 -->
    <a href="./index.html">index파일로 이동</a>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/hezOIhqhwLY?si=fiZvj4etPd5ifvhl" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
