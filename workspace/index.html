<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>첫 HTML! </title>
</head>
<body>
    <h1>Hello, World!</h1>
    <!-- 
    [ctrl] + [/] : 주석 처리
    [ctrl] + [d]: 줄 삭제
    [Ctrl] + [Alt] + [↑] or [↓]: 여러 커서 선택
    [Ctrl] + [Shift] + [L]: 여러 단어 선택
    [Alt] + [shift] + [↑] or [↓]: 줄 복사 
    [Alt] + [↑] or [↓]: 줄 이동
    [F1] : vs code 커널
    [ctrl] + [shift] + [p]: 명령어 팔레트
    [Home]: 커서를 맨 앞으로
    [End]: 커서를 맨 뒤로
    [Shift] + [Home]: 커서부터 맨 앞까지 선택
    [Shift] + [End]: 커서부터 맨 뒤까지 선택
    -->
</body>
</html>
