<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리스트(목록 태그)</title>
</head>
<body>
    <!-- 
        태그이 역할을 맞춰서 사용해야되는 이유  -> SEO
        목록 태그(ol, ul, li)
        1. ol, li : 순서가 있는 목록
        2. ul, li : 순서가 없는 목록
    -->
    <ol>
        <li>1. 순서가 있는 목록 1</li>
        <li>2. 순서가 있는 목록 2</li>
        <li>3. 순서가 있는 목록 3</li>
    </ol>
    <ul>
        <li>순서가 없는 목록 1</li>
        <li>순서가 없는 목록 2</li>
        <li>순서가 없는 목록 3</li>
    </ul>
    
</body>
</html>
